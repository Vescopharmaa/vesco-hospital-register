<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนโรงพยาบาล | Vesco Pharmaceutical</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f7fb;
      margin: 0;
      padding: 20px;
      color: #203047;
    }
    .card {
      max-width: 460px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }
    h2 { color: #176b55; margin-top: 0; }
    p { line-height: 1.6; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccd5df;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #176b55;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #status { margin-top: 16px; white-space: pre-wrap; }
    .small { font-size: 13px; color: #637184; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Vesco Pharmaceutical</h2>
    <p>แบบฟอร์มลงทะเบียนโรงพยาบาล</p>
    <p class="small">
      กรุณากรอกข้อมูลเพื่อให้บริษัทตรวจสอบและเชื่อมบัญชี LINE
      กับโรงพยาบาลของท่าน
    </p>

    <form id="regForm">
      <label for="hospitalId">รหัสโรงพยาบาล *</label>
      <input id="hospitalId" required
             placeholder="เช่น AYA0111">

      <label for="hospitalName">ชื่อโรงพยาบาล *</label>
      <input id="hospitalName" required
             placeholder="ชื่อโรงพยาบาล">

      <label for="contact">ชื่อผู้ติดต่อ</label>
      <input id="contact" placeholder="ชื่อผู้ประสานงาน">

      <label for="phone">เบอร์โทรศัพท์ติดต่อ</label>
      <input id="phone" type="tel" placeholder="เบอร์โทรศัพท์">

      <button id="submitBtn" type="submit" disabled>
        ลงทะเบียน
      </button>
    </form>

    <div id="status">กำลังเชื่อมต่อกับ LINE...</div>
  </div>

<script>
  // ใส่ LIFF ID หลังสร้าง LIFF App
  const LIFF_ID = "ใส่_LIFF_ID_ที่ได้จาก_LINE";

  // ใส่ Make Custom Webhook URL หลังสร้าง Webhook
  const MAKE_WEBHOOK_URL = "ใส่_MAKE_WEBHOOK_URL";

  let lineUserId = "";

  const statusBox = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  async function initApp() {
    try {
      if (LIFF_ID.includes("ใส่_")) {
        statusBox.textContent =
          "ยังไม่ได้ตั้งค่า LIFF ID กรุณาตั้งค่าก่อนใช้งาน";
        return;
      }

      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      lineUserId = profile.userId;

      statusBox.textContent = "เชื่อมต่อ LINE แล้ว พร้อมกรอกข้อมูล";
      submitBtn.disabled = false;
    } catch (error) {
      statusBox.textContent =
        "เชื่อมต่อ LINE ไม่สำเร็จ กรุณาลองเปิดฟอร์มจาก LINE อีกครั้ง";
      console.error(error);
    }
  }

  document.getElementById("regForm").addEventListener(
    "submit", async function(event) {
      event.preventDefault();

      if (!lineUserId) {
        statusBox.textContent = "ยังไม่พบ LINE User ID";
        return;
      }

      if (MAKE_WEBHOOK_URL.includes("ใส่_")) {
        statusBox.textContent =
          "ยังไม่ได้ตั้งค่า Make Webhook กรุณาตั้งค่าก่อนส่งข้อมูล";
        return;
      }

      submitBtn.disabled = true;
      statusBox.textContent = "กำลังส่งข้อมูล...";

      const data = {
        lineUserId: lineUserId,
        hospitalId: document.getElementById("hospitalId").value.trim(),
        hospitalName: document.getElementById("hospitalName").value.trim(),
        contact: document.getElementById("contact").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        submittedAt: new Date().toISOString()
      };

      try {
        const response = await fetch(MAKE_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error("ส่งข้อมูลไม่สำเร็จ");
        }

        statusBox.textContent =
          "ส่งข้อมูลแล้วค่ะ กรุณารอเจ้าหน้าที่ตรวจสอบการลงทะเบียน";
        document.getElementById("regForm").reset();
      } catch (error) {
        statusBox.textContent =
          "ยังส่งข้อมูลไม่สำเร็จ กรุณาลองอีกครั้งหรือติดต่อบริษัท";
        console.error(error);
      } finally {
        submitBtn.disabled = false;
      }
    }
  );

  initApp();
</script>
</body>
</html>
